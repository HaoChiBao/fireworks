<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fireworks</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
      touch-action: none;
    }
    #panel {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 228px;
      max-height: calc(100vh - 28px);
      overflow: auto;
      padding: 12px 14px 10px;
      background: rgba(8, 8, 8, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #cfcfcf;
      font: 12px/1.3 Consolas, "Courier New", monospace;
      z-index: 2;
    }
    #panel h2 {
      margin: 11px 0 6px;
      color: #8d8d8d;
      font: inherit;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    #panel h2:first-child { margin-top: 0; }
    #panel label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }
    #panel .val { color: #9a9a9a; }
    #panel input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 2px;
      margin: 7px 0 2px;
      background: #3a3a3a;
      outline: none;
      cursor: pointer;
    }
    #panel input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e4d08a;
    }
    #panel input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      background: #e4d08a;
    }
    #panel button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      color: #cfcfcf;
      font: inherit;
      cursor: pointer;
    }
    #panel button:hover {
      border-color: #e4d08a;
      color: #e4d08a;
    }
  </style>
</head>
<body>
<canvas id="sky"></canvas>
<aside id="panel">
  <h2>Screen</h2>
  <label>Columns <span class="val" data-for="columns"></span></label>
  <input type="range" data-key="columns" min="80" max="640" step="2" value="302">
  <label>Height <span class="val" data-for="aspect"></span></label>
  <input type="range" data-key="aspect" min="1.4" max="2.2" step="0.05" value="1.7">

  <h2>Burst</h2>
  <label>Size <span class="val" data-for="size"></span></label>
  <input type="range" data-key="size" min="0.4" max="2.4" step="0.05" value="0.4">
  <label>Arms <span class="val" data-for="arms"></span></label>
  <input type="range" data-key="arms" min="4" max="64" step="1" value="54">
  <label>Gravity <span class="val" data-for="gravity"></span></label>
  <input type="range" data-key="gravity" min="0.25" max="2.5" step="0.05" value="1.35">

  <h2>Shape</h2>
  <label>Asymmetry <span class="val" data-for="asymmetry"></span></label>
  <input type="range" data-key="asymmetry" min="0" max="1" step="0.01" value="0.75">
  <label>Noise <span class="val" data-for="noise"></span></label>
  <input type="range" data-key="noise" min="0" max="1" step="0.01" value="0.6">
  <label>Fade <span class="val" data-for="fade"></span></label>
  <input type="range" data-key="fade" min="0" max="1" step="0.01" value="0.35">
  <button id="bg" type="button">White background</button>
  <button id="glow" type="button">Glow on</button>
</aside>
<script>
// Recreation of rvizzz/text_art_animations fireworks.
// A click blooms from a point into dense ASCII streaks that arc under gravity.
const BANDS = [
  [".", "`", "'", ","],
  ["-", ";", "^", "_", "'"],
  [")", "!", "[", "]", "(", "+"],
  ["=", "/", "\\", "*", "^", "+"],
  ["Y", "y", "x", "Z", "$", "z", "7", "1"],
  ["5", "%", "9", "#", "4", "8", "*", "Z"],
  ["8", "0", "@", "#", "%", "X"]
];

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d", { alpha: false });

let cssW = 0;
let cssH = 0;
let cellW = 10;
let cellH = 18;
let cols = 0;
let rows = 0;
let energy, glyphs, colors;
let hinted = true;
let lightSky = false;
let glow = false;
let viewScale = 1;
let fontCss = "";
let lit = [];
let litCount = 0;
const glyphCache = new Map();
let cacheGen = 0;
let glowCanvas = null;
let glowCtx = null;
let colorCanvas = null;
let colorCtx = null;
const ATLAS = 1024;
let atlasPages = [];
let atlasCtxs = [];
let atlasIndex = -1;
let atlasX = 0;
let atlasY = 0;
let atlasRowH = 0;
let scratch = null;
let scratchCtx = null;

const controls = {
  columns: 302,
  aspect: 1.7,
  size: 0.4,
  arms: 54,
  gravity: 1.35,
  asymmetry: 0.75,
  noise: 0.6,
  fade: 0.35
};

const rockets = [];
const sparks = [];
let last = performance.now();

function layout() {
  viewScale = Math.min(window.devicePixelRatio || 1, 2);
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  canvas.width = Math.max(1, Math.floor(cssW * viewScale));
  canvas.height = Math.max(1, Math.floor(cssH * viewScale));
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);

  cols = Math.max(1, Math.round(controls.columns));
  cellW = cssW / cols;
  cellH = cellW * controls.aspect;
  rows = Math.max(1, Math.round(cssH / cellH));
  cellH = cssH / rows;

  energy = new Float32Array(cols * rows);
  glyphs = new Array(cols * rows);
  colors = new Uint32Array(cols * rows);
  lit = [];
  litCount = 0;
  fontCss = `${Math.max(7, Math.floor(cellH * 0.92))}px Consolas, "Courier New", monospace`;
  ctx.font = fontCss;
  ctx.textBaseline = "top";
  ctx.textAlign = "left";
  resetAtlas();
  if (!glowCanvas) {
    glowCanvas = document.createElement("canvas");
    glowCtx = glowCanvas.getContext("2d", { alpha: true });
    colorCanvas = document.createElement("canvas");
    colorCtx = colorCanvas.getContext("2d", { alpha: true });
  }
  glowCanvas.width = canvas.width;
  glowCanvas.height = canvas.height;
  colorCanvas.width = canvas.width;
  colorCanvas.height = canvas.height;
  paintControls();
}

function noteLit(i) {
  if (litCount < lit.length) lit[litCount] = i;
  else lit.push(i);
  litCount++;
}

function dropAt(list, i) {
  const last = list.length - 1;
  const item = list.pop();
  if (i < last) {
    list[i] = item;
    return true;
  }
  return false;
}

function pack(rgb) {
  return (rgb[0] << 16) | (rgb[1] << 8) | rgb[2];
}

function stamp(x, y, e, rgb) {
  if (e <= 0) return;
  const c = (x / cellW) | 0;
  const r = (y / cellH) | 0;
  if (c < 0 || r < 0 || c >= cols || r >= rows) return;
  const i = r * cols + c;
  if (energy[i] > 0) return;
  energy[i] = e;
  const band = Math.min(BANDS.length - 1, (e * BANDS.length) | 0);
  const set = BANDS[band];
  glyphs[i] = set[(Math.random() * set.length) | 0];
  colors[i] = pack(rgb);
  noteLit(i);
}

function stampChar(x, y, ch, rgb, rank) {
  const c = (x / cellW) | 0;
  const r = (y / cellH) | 0;
  if (c < 0 || r < 0 || c >= cols || r >= rows) return;
  const i = r * cols + c;
  const next = rank == null ? 1 : rank;
  if (energy[i] >= next) return;
  const fresh = energy[i] <= 0;
  energy[i] = next;
  glyphs[i] = ch;
  colors[i] = pack(rgb);
  if (fresh) noteLit(i);
}

function glyphChar(zDir) {
  if (zDir > 0.2) return BANDS[0][(Math.random() * BANDS[0].length) | 0];
  const set = BANDS[2 + ((Math.random() * (BANDS.length - 2)) | 0)];
  return set[(Math.random() * set.length) | 0];
}

// Neighboring pairs. The same bright colors are used on both backgrounds; the black shadow keeps them readable on white.
const COLOR_PAIRS = [
  [[2, 100, 52], [28, 100, 52]],
  [[50, 100, 52], [78, 100, 48]],
  [[126, 100, 46], [156, 95, 48]],
  [[208, 100, 58], [246, 95, 62]]
];

function hsl(h, s, l) {
  s /= 100;
  l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const hp = ((h % 360) + 360) % 360 / 60;
  const x = c * (1 - Math.abs(hp % 2 - 1));
  let r = 0;
  let g = 0;
  let b = 0;
  if (hp < 1) { r = c; g = x; }
  else if (hp < 2) { r = x; g = c; }
  else if (hp < 3) { g = c; b = x; }
  else if (hp < 4) { g = x; b = c; }
  else if (hp < 5) { r = x; b = c; }
  else { r = c; b = x; }
  const m = l - c / 2;
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function pairRgb(pair) {
  return [hsl(pair[0][0], pair[0][1], pair[0][2]), hsl(pair[1][0], pair[1][1], pair[1][2])];
}

function pickScheme() {
  if (Math.random() < 0.14) return { rainbow: true, colors: null };
  const pair = COLOR_PAIRS[(Math.random() * COLOR_PAIRS.length) | 0];
  return { rainbow: false, colors: pairRgb(pair) };
}

function sparkRgb(scheme, angle, slot) {
  if (scheme.rainbow) {
    const hue = ((angle + Math.PI) / (Math.PI * 2)) * 360;
    return hsl(hue, 88, 60);
  }
  return scheme.colors[slot % 2];
}

function addSpark(x, y, ang, speed, life, grav, color, zDir) {
  const z = zDir || 0;
  const ring = Math.sqrt(Math.max(0, 1 - z * z));
  const depthScale = z > 0 ? 1 / (1 + 0.9 * z) : 1;
  const screen = speed * ring * depthScale;
  sparks.push({
    x,
    y,
    ovx: Math.cos(ang) * screen,
    ovy: Math.sin(ang) * screen,
    zDir: z,
    vx: 0,
    vy: 0,
    age: 0,
    life,
    grav,
    wobble: (Math.random() - 0.5) * 0.6 * (controls.noise / 0.6),
    glyphs: [],
    last: null,
    falling: false,
    color
  });
}

function burstReach() {
  return Math.max(0.35, rows / 32) * controls.size;
}

function explode(x, y, scheme, scale) {
  const reach = burstReach();
  const asym = controls.asymmetry;
  const rays = Math.max(4, Math.round(controls.arms * Math.max(0.75, scale)));
  let ang = Math.random() * Math.PI * 2;
  const step = (Math.PI * 2) / rays;
  for (let i = 0; i < rays; i++) {
    ang += step;
    const aim = ang + (Math.random() - 0.5) * step * (0.35 + asym * 0.5);
    const stretch = 0.9 + Math.random() * (0.2 + asym * 0.15);
    const speed = (38 + Math.random() * 14) * stretch * cellH * reach;
    const life = 2.2 + Math.random() * 0.7;
    const grav = 0.72 + Math.random() * 0.28;
    const zDir = i % 3 === 1 ? 0.6 : i % 3 === 2 ? -0.6 : 0;
    addSpark(x, y, aim, speed, life, grav, sparkRgb(scheme, aim, i), zDir);
  }
  const fuzz = Math.max(6, Math.round(rays * 0.42));
  for (let i = 0; i < fuzz; i++) {
    const aim = Math.random() * Math.PI * 2;
    const speed = (4 + Math.random() * 11) * cellH * reach;
    const zDir = i % 2 === 0 ? 0.45 : -0.45;
    addSpark(
      x,
      y,
      aim,
      speed,
      0.75 + Math.random() * 0.55,
      0.35 + Math.random() * 0.3,
      sparkRgb(scheme, aim, i),
      zDir
    );
  }
}

function launch(x, y) {
  hinted = false;
  const scheme = pickScheme();
  const room = cssH - y;
  if (room < cellH * 5) {
    explode(x, y, scheme, 1);
    return;
  }
  rockets.push({
    x,
    y: cssH - cellH * 0.5,
    tx: x,
    ty: y,
    scheme,
    age: 0,
    dur: Math.max(0.28, Math.min(0.78, room / (cssH * 1.15))),
    phase: "rise",
    hold: 0,
    sway: Math.random() * Math.PI * 2,
    sway2: Math.random() * Math.PI * 2,
    trail: [],
    trailStart: 0
  });
}

function rocketColor(rocket) {
  if (rocket.scheme.rainbow) {
    const hue = Math.round(((rocket.age * 280) % 360) / 2) * 2;
    return hsl(hue, 88, 62);
  }
  return rocket.scheme.colors[0];
}

function fadeMul() {
  return 1.35 - controls.fade;
}

function dieTime(s, index, total) {
  const span = Math.max(0.3, s.life - s.age) * fadeMul();
  const youth = index / Math.max(1, total - 1);
  const t = Math.pow(Math.random(), 0.55) * (0.2 + 0.68 * youth);
  return s.age + Math.max(0.04, t) * span;
}

function pushGlyph(s, x, y, rgb) {
  const span = Math.max(0.2, s.life - s.age) * fadeMul();
  s.glyphs.push({
    x: x + (Math.random() - 0.5) * cellW * 0.18 * (controls.noise / 0.6),
    y: y + (Math.random() - 0.5) * cellH * 0.12 * (controls.noise / 0.6),
    ch: glyphChar(s.zDir),
    rgb,
    dieAt: s.falling ? s.age + (0.05 + Math.random() * 0.28) * span : Infinity
  });
}

function beginFall(s) {
  s.falling = true;
  const total = Math.max(1, s.glyphs.length);
  for (let i = 0; i < s.glyphs.length; i++) {
    if (s.glyphs[i].dieAt < Infinity) continue;
    s.glyphs[i].dieAt = dieTime(s, i, total);
  }
}

function layGlyphs(s, x0, y0, x1, y1, gap) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  const rgb = s.color;
  const steps = Math.max(1, Math.ceil(len / gap));
  for (let t = 1; t <= steps; t++) {
    const u = t / steps;
    const px = x0 + dx * u;
    const py = y0 + dy * u;
    pushGlyph(s, px, py, rgb);
  }
}

function step(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    if (r.phase === "gone") {
      r.hold -= dt;
      if (r.hold <= 0) {
        explode(r.tx, r.ty, r.scheme, 1);
        if (dropAt(rockets, i)) i++;
      }
      continue;
    }
    r.age += dt;
    const t = Math.min(1, r.age / r.dur);
    // Constant deceleration: most of the climb is early, then it coasts to a stop.
    const ease = 1 - Math.pow(1 - t, 3);
    const y = r.y + (r.ty - r.y) * ease;
    const bend =
      Math.sin(t * Math.PI * 2 * 1.35 + r.sway) * 0.7 +
      Math.sin(t * Math.PI * 2 * 2.6 + r.sway2) * 0.3;
    const envelope =
      Math.sin(Math.min(1, t / 0.14) * Math.PI * 0.5) * Math.min(1, (1 - t) / 0.2);
    const x = r.tx + bend * cellW * 5.5 * envelope;
    const prev = r.trail[r.trail.length - 1];
    if (!prev || Math.abs(y - prev.y) > cellH * 0.7 || Math.abs(x - prev.x) > cellW * 0.75) {
      r.trail.push({ x, y });
    }
    // Climb speed falls with (1-t)^2, so the streak is long at launch and gone at the peak.
    const speedFrac = (1 - t) * (1 - t);
    const tail = Math.round(84 * speedFrac);
    let start = r.trailStart;
    while (r.trail.length - start > tail) start++;
    if (start > 48) {
      r.trail.splice(0, start);
      start = 0;
    }
    r.trailStart = start;
    if (t >= 1) {
      r.phase = "gone";
      r.hold = 0.16;
      r.trail.length = 0;
      r.trailStart = 0;
      continue;
    }
    const head = rocketColor(r);
    const n = r.trail.length - start;
    for (let k = 0; k < n; k++) {
      const p = r.trail[start + k];
      const e = k === n - 1 ? 1 : 0.28 + 0.45 * (k / n);
      stamp(p.x, p.y, e, head);
    }
  }

  const g = 16 * cellH * burstReach() * controls.gravity;
  const gap = Math.min(cellW, cellH) * 0.42;
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.age += dt;
    if (s.y > cssH + cellH * 4) {
      if (dropAt(sparks, i)) i++;
      continue;
    }
    if (!s.burning) {
      s.vx = s.ovx;
      s.vy = s.ovy;
      s.burning = true;
    }
    const sp0 = Math.hypot(s.vx, s.vy);
    const drag = 2.4 + sp0 * 0.0032;
    s.vx *= Math.exp(-drag * dt);
    s.vy *= Math.exp(-drag * dt);
    const launchSpeed = Math.hypot(s.ovx, s.ovy) || 1;
    if (sp0 < launchSpeed * 0.62) s.vy += g * s.grav * dt;
    s.wobble += (Math.random() - 0.5) * 7 * (controls.noise / 0.6) * dt;
    s.wobble *= Math.exp(-2.4 * dt);
    const sp = Math.hypot(s.vx, s.vy) || 1;
    const shove = s.wobble * cellH * 0.9 * dt;
    const px = -s.vy / sp;
    const py = s.vx / sp;
    s.vx += px * shove;
    s.vy += py * shove;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    const coasting = sp < launchSpeed * 0.42 && s.vy > cellH * 0.5 && s.age > 0.34;
    if (s.burning && !s.falling && (coasting || s.age > s.life * 0.5)) beginFall(s);

    const prev = s.last;
    if (!prev || Math.hypot(s.x - prev.x, s.y - prev.y) >= gap) {
      if (prev) layGlyphs(s, prev.x, prev.y, s.x, s.y, gap);
      s.last = { x: s.x, y: s.y };
    }

    for (let k = s.glyphs.length - 1; k >= 0; k--) {
      const glyph = s.glyphs[k];
      if (s.age >= glyph.dieAt) {
        if (dropAt(s.glyphs, k)) k++;
        continue;
      }
      stampChar(glyph.x, glyph.y, glyph.ch, glyph.rgb, 1 - s.zDir);
    }
    if (s.age >= s.life || (s.falling && s.glyphs.length === 0)) {
      if (dropAt(sparks, i)) i++;
    }
  }

  if (sparks.length > 4200) sparks.splice(0, sparks.length - 4200);
}

function newAtlasPage() {
  const page = document.createElement("canvas");
  page.width = ATLAS;
  page.height = ATLAS;
  atlasPages.push(page);
  atlasCtxs.push(page.getContext("2d", { alpha: true }));
  atlasIndex = atlasPages.length - 1;
  atlasX = 0;
  atlasY = 0;
  atlasRowH = 0;
}

function resetAtlas() {
  atlasPages = [];
  atlasCtxs = [];
  atlasIndex = -1;
  atlasX = 0;
  atlasY = 0;
  atlasRowH = 0;
  glyphCache.clear();
  newAtlasPage();
}

function makeSprite(ch, fill) {
  const pad = 2;
  const width = Math.max(cellW, ctx.measureText(ch).width);
  const cssWidth = width + pad * 2;
  const cssHeight = cellH + pad * 2;
  const pw = Math.max(1, Math.ceil(cssWidth * viewScale));
  const ph = Math.max(1, Math.ceil(cssHeight * viewScale));
  if (!scratch || scratch.width < pw || scratch.height < ph) {
    scratch = document.createElement("canvas");
    scratch.width = Math.max(pw, 128);
    scratch.height = Math.max(ph, 128);
    scratchCtx = scratch.getContext("2d", { alpha: true });
  }
  scratchCtx.setTransform(1, 0, 0, 1, 0, 0);
  scratchCtx.clearRect(0, 0, pw, ph);
  scratchCtx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  scratchCtx.font = fontCss;
  scratchCtx.textBaseline = "top";
  scratchCtx.textAlign = "left";
  scratchCtx.fillStyle = fill;
  scratchCtx.fillText(ch, pad, pad);

  if (atlasIndex < 0) newAtlasPage();
  if (atlasX + pw > ATLAS) {
    atlasX = 0;
    atlasY += atlasRowH;
    atlasRowH = 0;
  }
  if (atlasY + ph > ATLAS) newAtlasPage();
  const actx = atlasCtxs[atlasIndex];
  actx.setTransform(1, 0, 0, 1, 0, 0);
  actx.drawImage(scratch, 0, 0, pw, ph, atlasX, atlasY, pw, ph);
  const entry = {
    atlas: atlasPages[atlasIndex],
    sx: atlasX,
    sy: atlasY,
    sw: pw,
    sh: ph,
    ox: pad,
    oy: pad,
    cssW: cssWidth,
    cssH: cssHeight,
    gen: cacheGen
  };
  atlasX += pw;
  if (ph > atlasRowH) atlasRowH = ph;
  return entry;
}

function paintGlyph(target, ch, key, x, y) {
  let bucket = glyphCache.get(key);
  if (!bucket) {
    bucket = new Map();
    glyphCache.set(key, bucket);
  }
  let entry = bucket.get(ch);
  if (entry) entry.gen = cacheGen;
  else {
    const fill = "rgb(" + ((key >> 16) & 255) + "," + ((key >> 8) & 255) + "," + (key & 255) + ")";
    entry = makeSprite(ch, fill);
    bucket.set(ch, entry);
  }
  target.drawImage(
    entry.atlas, entry.sx, entry.sy, entry.sw, entry.sh,
    x - entry.ox, y - entry.oy, entry.cssW, entry.cssH
  );
}

function pruneGlyphCache() {
  cacheGen++;
  if (atlasPages.length > 3) {
    resetAtlas();
    return;
  }
  if ((cacheGen & 63) !== 0) return;
  for (const [key, bucket] of glyphCache) {
    for (const [ch, entry] of bucket) {
      if (cacheGen - entry.gen > 64) bucket.delete(ch);
    }
    if (bucket.size === 0) glyphCache.delete(key);
  }
}

function draw() {
  ctx.fillStyle = lightSky ? "#ffffff" : "#000000";
  ctx.fillRect(0, 0, cssW, cssH);
  ctx.font = fontCss;

  if (litCount > 0) {
    colorCtx.setTransform(1, 0, 0, 1, 0, 0);
    colorCtx.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
    colorCtx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
    for (let n = 0; n < litCount; n++) {
      const i = lit[n];
      paintGlyph(colorCtx, glyphs[i], colors[i], (i % cols) * cellW, ((i / cols) | 0) * cellH);
    }

    // The shadow is black, so on a black sky it adds nothing. Blur the
    // silhouette once instead of blurring every character.
    if (glow && lightSky) {
      glowCtx.setTransform(1, 0, 0, 1, 0, 0);
      glowCtx.globalCompositeOperation = "source-over";
      glowCtx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);
      glowCtx.drawImage(colorCanvas, 0, 0);
      glowCtx.globalCompositeOperation = "source-in";
      glowCtx.fillStyle = "#000000";
      glowCtx.fillRect(0, 0, glowCanvas.width, glowCanvas.height);
      glowCtx.globalCompositeOperation = "source-over";
      ctx.save();
      ctx.shadowColor = "#000000";
      ctx.shadowBlur = Math.max(16, cellH * 4);
      ctx.drawImage(glowCanvas, 0, 0, cssW, cssH);
      ctx.drawImage(glowCanvas, 0, 0, cssW, cssH);
      ctx.restore();
    }

    ctx.drawImage(colorCanvas, 0, 0, cssW, cssH);
  }
  pruneGlyphCache();

  if (hinted && rockets.length === 0 && sparks.length === 0) {
    ctx.fillStyle = lightSky ? "#3a3a3a" : "#6a6a6a";
    ctx.font = fontCss;
    const msg = "click";
    ctx.fillText(msg, (cssW - msg.length * cellW) / 2, (cssH - cellH) / 2);
  }
}

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  litCount = 0;
  energy.fill(0);
  step(dt);
  draw();
  requestAnimationFrame(frame);
}

function controlText(key) {
  const value = controls[key];
  if (key === "columns") return cols + " × " + rows;
  if (key === "aspect") return value.toFixed(2);
  if (key === "size" || key === "gravity") return value.toFixed(2) + "×";
  if (key === "arms") return String(value);
  return Math.round(value * 100) + "%";
}

function paintControls() {
  for (const key of Object.keys(controls)) {
    const node = document.querySelector(`[data-for="${key}"]`);
    if (node) node.textContent = controlText(key);
  }
}

document.getElementById("panel").addEventListener("input", (event) => {
  const key = event.target.dataset.key;
  if (!key) return;
  controls[key] = Number(event.target.value);
  if (key === "columns" || key === "aspect") layout();
  else paintControls();
});

document.getElementById("panel").addEventListener("pointerdown", (event) => {
  event.stopPropagation();
});

document.getElementById("bg").addEventListener("click", () => {
  lightSky = !lightSky;
  document.body.style.background = lightSky ? "#ffffff" : "#000000";
  document.getElementById("bg").textContent = lightSky ? "Black background" : "White background";
});

document.getElementById("glow").addEventListener("click", () => {
  glow = !glow;
  document.getElementById("glow").textContent = glow ? "Glow off" : "Glow on";
});

canvas.addEventListener("pointerdown", (e) => {
  launch(e.clientX, e.clientY);
});

window.addEventListener("resize", layout);
layout();
requestAnimationFrame(frame);
</script>
</body>
</html>
